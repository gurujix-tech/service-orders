# Default values for local kind. Override per env later (GitOps values files).
# Optional renames used by _helpers.tpl (leave empty to use chart name).
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: service-orders
  tag: local
  # IfNotPresent: use image loaded via `kind load` (no registry pull).
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

probes:
  readiness:
    path: /ready
    initialDelaySeconds: 2
    periodSeconds: 5
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

# Phase 7c — workload security baseline (matches Dockerfile USER 10001).
# Keep these defaults for every service; override only with a documented exception.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop: ["ALL"]
