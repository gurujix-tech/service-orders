# Complete values for EKS — use alone:
#   helm upgrade --install service-orders deploy/helm/service-orders \
#     -n default -f deploy/helm/service-orders/values-eks.yaml
#
# kind still uses values.yaml only (ingress off, local image).

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: 577572726499.dkr.ecr.us-east-1.amazonaws.com/service-orders
  # Set at deploy time: --set image.tag=<git-sha>
  tag: "63862009c822be3ff1bf5b1d9865648d8c8366e1"
  pullPolicy: Always

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  host: app.gurujix.com
  certificateArn: "arn:aws:acm:us-east-1:577572726499:certificate/748464e0-ad6d-4780-b953-7774edb962f3"
  healthcheckPath: /health

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

probes:
  readiness:
    path: /ready
    initialDelaySeconds: 2
    periodSeconds: 5
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop: ["ALL"]
